### Profiles ###

####################################################################
# HDR Profiles (2026 metadata-aware) - Best for Linux/AMD/gpu-next #
####################################################################

[HDR]
profile-desc=Shared HDR behavior for PQ/HLG content (Linux/Wayland optimized)
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy

target-colorspace-hint=yes
target-colorspace-hint-mode=source-dynamic   # Uses source metadata for best output hints
target-prim=bt.2020
target-trc=auto                              # Keeps your SDR tone-mapping behavior intact

[auto-hdr-generic]
profile-desc=Generic HDR fallback (no HDR10+ or advanced DV metadata)
profile-cond=(p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and (get("video-params/scene-max-r", 0) <= 0) and (get("video-params/scene-max-g", 0) <= 0) and (get("video-params/scene-max-b", 0) <= 0) and (get("current-tracks/video/dolby-vision-profile", 0) ~= 5) and (get("current-tracks/video/dolby-vision-profile", 0) ~= 8) and (get("current-tracks/video/dolby-vision-profile", 0) ~= 9)
profile-restore=copy

hdr-compute-peak=yes
allow-delayed-peak-detect=yes

[auto-dolby-vision-rpu]
profile-desc=Prefer Dolby Vision RPU metadata (Profiles 5/8/9)
profile-cond=(get("current-tracks/video/dolby-vision-profile", 0) == 5) or (get("current-tracks/video/dolby-vision-profile", 0) == 8) or (get("current-tracks/video/dolby-vision-profile", 0) == 9)
profile-restore=copy

hdr-compute-peak=no

[auto-hdr10plus]
profile-desc=Prefer real HDR10+ dynamic scene metadata
profile-cond=(get("video-params/scene-max-r", 0) > 0) or (get("video-params/scene-max-g", 0) > 0) or (get("video-params/scene-max-b", 0) > 0)
profile-restore=copy

tone-mapping=st2094-40   # Best when real HDR10+ metadata is present
hdr-compute-peak=no


###################
# Everything else #
###################

[Deband-Medium]
deband-iterations=2
deband-threshold=64
deband-range=16
deband-grain=24

[Deband-Strong]
deband-iterations=3
deband-threshold=64
deband-range=16
deband-grain=24

